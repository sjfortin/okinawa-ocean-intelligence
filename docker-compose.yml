services:
  db:
    build:
      context: ./docker/db
    environment:
      POSTGRES_DB: ooi
      POSTGRES_USER: ooi
      POSTGRES_PASSWORD: ooi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ooi -d ooi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ooi_postgres:/var/lib/postgresql/data

volumes:
  ooi_postgres:

